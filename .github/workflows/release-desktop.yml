name: Release Windows Desktop Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL produksi web PT YPTI (opsional, mengesampingkan secret/var DESKTOP_APP_URL)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop wrapper dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows NSIS installer (.exe)
        working-directory: desktop
        env:
          INPUT_APP_URL: ${{ github.event.inputs.app_url }}
          SECRET_APP_URL: ${{ secrets.DESKTOP_APP_URL }}
          VAR_APP_URL: ${{ vars.DESKTOP_APP_URL }}
        shell: pwsh
        run: |
          $targetUrl = $env:INPUT_APP_URL
          if ([string]::IsNullOrWhiteSpace($targetUrl)) { $targetUrl = $env:SECRET_APP_URL }
          if ([string]::IsNullOrWhiteSpace($targetUrl)) { $targetUrl = $env:VAR_APP_URL }
          if ([string]::IsNullOrWhiteSpace($targetUrl)) {
            Write-Error "DESKTOP_APP_URL belum disetel pada GitHub Secrets/Variables atau input workflow."
            exit 1
          }
          $env:DESKTOP_APP_URL = $targetUrl
          npm run build:win

      - name: Publish installer assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
