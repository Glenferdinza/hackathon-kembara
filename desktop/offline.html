<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koneksi Server Terputus - PT YPTI Tool Room ERP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      font-size: 13px;
      font-weight: 700;
      color: #0F172A;
    }
    .card-body {
      padding: 20px;
      font-size: 13px;
      line-height: 1.55;
      color: #475569;
    }
    .meta {
      margin: 14px 0;
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #334155;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #1E40AF;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1E3A8A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">PT YPTI TOOL ROOM &amp; INVENTORY ERP</div>
    <div class="card-body">
      <div>Tidak dapat terhubung ke server aplikasi pusat PT YPTI. Periksa koneksi jaringan atau status server web.</div>
      <div class="meta" id="target-meta">Server tujuan belum terbaca.</div>
      <button type="button" id="retry-btn">Coba Hubungkan Ulang</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');
    const code = params.get('code');
    const metaEl = document.getElementById('target-meta');
    if (url) {
      metaEl.textContent = url + (code ? ' (Kode ' + code + ')' : '');
    }
    document.getElementById('retry-btn').addEventListener('click', () => {
      if (window.yptiDesktop && typeof window.yptiDesktop.retryConnection === 'function') {
        window.yptiDesktop.retryConnection();
      } else {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
